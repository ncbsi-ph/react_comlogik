<!DOCTYPE html>
<html>
  <head>
    <base href="<%=htmlWebpackPlugin.options.base%>" />
    <title><%=htmlWebpackPlugin.options.title%></title>
    <link rel="icon" href="static/icon.png" />
    <script>
      (function () {
        var legacyHosts = ['comlogikph.com', 'www.comlogikph.com'];
        var currentHost = window.location.hostname.toLowerCase();

        // Keep local development and Netlify preview URLs on the existing site.
        if (legacyHosts.indexOf(currentHost) === -1) return;

        var storageKey = 'comlogik:new-site-landing-session';
        var returnParameter = 'from';

        try {
          var searchParameters = new URLSearchParams(window.location.search);

          // Let visitors return from the new landing page during this browser
          // tab's session. The query parameter is the reliable path; the
          // referrer keeps the existing landing-page button working as well.
          var hasReturnParameter =
            searchParameters.get(returnParameter) === 'new-site';
          var isReturningFromNewSite =
            hasReturnParameter ||
            document.referrer.indexOf('https://new.comlogikph.com/') === 0;

          if (isReturningFromNewSite) {
            try {
              window.sessionStorage.setItem(storageKey, 'true');
            } catch (error) {
              // The return link still works for this page load without storage.
            }
            if (hasReturnParameter) searchParameters.delete(returnParameter);

            var cleanSearch = searchParameters.toString();
            window.history.replaceState(
              null,
              '',
              window.location.pathname +
                (cleanSearch ? '?' + cleanSearch : '') +
                window.location.hash
            );
            return;
          }

          try {
            if (window.sessionStorage.getItem(storageKey) === 'true') return;
          } catch (error) {
            // Continue to the landing page if session storage is unavailable.
          }

          // Direct visits stay directed to the landing page until the visitor
          // uses its return button. The session marker then expires when the
          // visitor closes this tab/window.
          window.location.replace('https://new.comlogikph.com/');
        } catch (error) {
          // If browser URL APIs are unavailable, keep the current site accessible.
        }
      })();
    </script>
    <!-- ChatFuel custom Messenger bot -->
    <script id="60d98bc1de53814327fb342b" src="https://dashboard.chatfuel.com/integration/fb-entry-point.js" async defer></script>
    <!-- Recaptcha SDK -->
    <script
      src="https://www.google.com/recaptcha/api.js?render=explicit"
      async
      defer
    ></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
